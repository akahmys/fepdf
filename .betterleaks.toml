# Betterleaks configuration for Ferruginous project
# Custom rules for preventing PII (Personally Identifiable Information) leaks

title = "Ferruginous Custom Secret & PII Rules"

[[rules]]
id = "personal-name-jun-kato"
description = "Detects personal name 'Jun Kato' / 'Kato Jun' to prevent PII leakage"
regex = '''(?i)\b(jun[\s._-]*kato|kato[\s._-]*jun)\b'''
keywords = [
    "jun",
    "kato",
]
