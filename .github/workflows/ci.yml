name: CI & Compliance Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-and-test:
    name: Compliance & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Adobe's CMaps and CID tables and the Arlington model are submodules, and the
          # tests that read a CJK font or check a save against Arlington need them.
          submodules: recursive

      - name: Install System Dependencies (Linux GUI Build Requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libx11-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libasound2-dev libegl1-mesa-dev libwayland-dev fonts-noto-cjk

      # `rust-toolchain.toml` names the toolchain the gate runs on; installing `stable`
      # beside it changed nothing, since the pin wins in this directory. The MSRV check
      # in the audit builds with the stated minimum as well, so that is installed too.
      - name: Install Rust Toolchains
        run: |
          rustup toolchain install
          rustup toolchain install "$(grep -m1 'rust-version =' Cargo.toml | cut -d'"' -f2)" --profile minimal

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # A released binary, its checksum checked. The install script this fetched does not
      # exist, and `|| true` hid that, so Rule 18 failed on "command not found".
      - name: Install betterleaks
        env:
          VERSION: 1.9.0
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v$VERSION"
          file="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" betterleaks
          sudo install betterleaks /usr/local/bin/
          betterleaks version

      - name: Run RR-15 Compliance Audit Script
        run: |
          chmod +x ./scripts/audit/verify_compliance.sh
          ./scripts/audit/verify_compliance.sh

      - name: Run Cargo Workspace Check
        run: cargo check --workspace

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace

      - name: Run Clippy Audit
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo License Audit
        run: cargo deny check licenses
