name: Multi-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Targets (Apple Silicon & Intel)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: fepdf-macos-arm64
            binaries: "fepdf fepdf-gui"
            packages: "fepdf-cli fepdf-gui"
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: fepdf-macos-x64
            binaries: "fepdf fepdf-gui"
            packages: "fepdf-cli fepdf-gui"
          
          # Windows Targets (64-bit & 32-bit)
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: fepdf-windows-x64
            binaries: "fepdf.exe fepdf-gui.exe"
            packages: "fepdf-cli fepdf-gui"
          - os: windows-2022
            target: i686-pc-windows-msvc
            artifact_name: fepdf-windows-x86
            binaries: "fepdf.exe fepdf-gui.exe"
            packages: "fepdf-cli fepdf-gui"

          # Linux Targets (Static CLI & Dynamic GUI)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: fepdf-linux-static-x64
            binaries: "fepdf" # CLI statically linked
            packages: "fepdf-cli"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fepdf-linux-dynamic-x64
            binaries: "fepdf-gui" # GUI dynamically linked for graphics support
            packages: "fepdf-gui"

    steps:
    - name: Disable Symlinks on Windows
      if: "startsWith(matrix.os, 'windows')"
      run: git config --global core.symlinks false

    - uses: actions/checkout@v4
      with:
        # Adobe's CMap collections and CID-to-Unicode tables are submodules, and the
        # binaries cannot read a CJK document without them. Released archives carried
        # neither, because a checkout without this has neither: measured on
        # `bokutokitan.pdf`, the published binary extracted 4,554 bytes of text where the
        # same build beside the resources extracts 212,312.
        submodules: recursive

    - name: Install System Dependencies (Linux Only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxkbcommon-dev libx11-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libasound2-dev libegl1-mesa-dev libwayland-dev
        if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
          sudo apt-get install -y musl-tools
        fi

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build Binaries (Release Mode)
      shell: bash
      run: |
        for pkg in ${{ matrix.packages }}; do
          cargo build --release --target ${{ matrix.target }} -p $pkg
        done

    # `<exe>/resources/<name>` is the third entry in `fepdf_font::resources::search_paths`,
    # so a binary shipped beside this directory finds Adobe's tables wherever it is
    # unpacked. No code knows about packaging; the layout is the whole of the contract.
    - name: Stage Runtime Resources
      shell: bash
      run: |
        mkdir -p dist/resources
        cp -R external/adobe-cmaps dist/resources/cmaps
        cp -R external/mapping-resources-pdf/pdf2unicode dist/resources/cid2unicode
        cp -R crates/fepdf-script/scripting dist/resources/scripting
        rm -rf dist/resources/cmaps/.git dist/resources/cid2unicode/.git
        test -d dist/resources/cmaps/Adobe-Japan1-7 || {
          echo "::error::CMap collections missing — is the submodule checked out?"; exit 1; }

    - name: Prepare Artifacts (Unix)
      if: "!startsWith(matrix.os, 'windows')"
      shell: bash
      run: |
        for bin in ${{ matrix.binaries }}; do
          cp target/${{ matrix.target }}/release/$bin dist/
        done
        cd dist && tar -czf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.binaries }} resources

    - name: Prepare Artifacts (Windows)
      if: "startsWith(matrix.os, 'windows')"
      shell: pwsh
      run: |
        $binaries = "${{ matrix.binaries }}".Split(" ")
        foreach ($bin in $binaries) {
          Copy-Item "target\${{ matrix.target }}\release\$bin" -Destination "dist\"
        }
        Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact_name }}.zip"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.artifact_name }}.tar.gz
          ${{ matrix.artifact_name }}.zip

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts

    # macOS ships as two architectures rather than one universal binary. `lipo` made an
    # archive that was exactly the sum of the two — 22MB where an Apple Silicon reader needs
    # 10 — so every Mac downloaded the other architecture as well. That trade made sense
    # while Intel was the majority and stops making sense as it leaves support. It also
    # packaged macOS as a `.zip` where every other Unix target is a `.tar.gz`.
    #
    # The already-published `fepdf-macos-universal.zip` on v1.0.0 stays where it is: a
    # released asset that people have linked to is not renamed.
    - name: Rearrange Release Files
      run: |
        mkdir final_dist
        cp release_artifacts/fepdf-linux-static-x64/fepdf-linux-static-x64.tar.gz final_dist/
        cp release_artifacts/fepdf-linux-dynamic-x64/fepdf-linux-dynamic-x64.tar.gz final_dist/
        cp release_artifacts/fepdf-windows-x64/fepdf-windows-x64.zip final_dist/
        cp release_artifacts/fepdf-windows-x86/fepdf-windows-x86.zip final_dist/
        cp release_artifacts/fepdf-macos-arm64/fepdf-macos-arm64.tar.gz final_dist/
        cp release_artifacts/fepdf-macos-x64/fepdf-macos-x64.tar.gz final_dist/
        ls -la final_dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          final_dist/fepdf-linux-static-x64.tar.gz
          final_dist/fepdf-linux-dynamic-x64.tar.gz
          final_dist/fepdf-windows-x64.zip
          final_dist/fepdf-windows-x86.zip
          final_dist/fepdf-macos-arm64.tar.gz
          final_dist/fepdf-macos-x64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
