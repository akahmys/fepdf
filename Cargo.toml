[workspace]
resolver = "2"
members = [
    "crates/fepdf-syntax",
    "crates/fepdf-model",
    "crates/fepdf-font",
    "crates/fepdf-content",
    "crates/fepdf-render",
    "crates/fepdf-sdk",
    "crates/fepdf-mcp",
    "crates/fepdf-wasm",
    "crates/fepdf-gui",
    "crates/fepdf-cli",
    "crates/fepdf-macros",
]

[workspace.dependencies]
# Error Handling
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bytes = { version = "1.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Meta-programming
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Parallelism & Performance
rayon = "1.10"
parking_lot = "0.12"
id-arena = "2.2"
zstd = "0.13"

# PDF Physical Engine
lopdf = "0.34"
flate2 = "1.0"

# PDF Optimized Output
pdf-writer = "0.12"

# Font Processing
skrifa = "0.40.0"
read-fonts = "0.37.0"
ttf-parser = "0.21"

# Graphics & Rendering
vello = "0.9.0"
kurbo = { version = "0.13", features = ["serde"] }

# Color Management (Hardening)
moxcms = "0.8"

# Image Processing (Refined)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

# Metadata & Encoding
xmp-writer = "0.3"
roxmltree = "0.20"
chardetng = "0.1"
encoding_rs = "0.8"
nom = "7.1"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.8"
md5 = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"

# Cryptography & Certificates
x509-parser = "0.16"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
der = { version = "0.7", features = ["derive"] }
spki = "0.7"
rustls-native-certs = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
ecdsa = "0.16"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
signature = "2.2"

# Infrastructure & MCP
tokio = { version = "1.43", features = ["full"] }
rmcp = "1.5.0"
schemars = "1"

# Internal Workspace Crates
fepdf-syntax = { path = "crates/fepdf-syntax", version = "1.0.0" }
fepdf-model = { path = "crates/fepdf-model", version = "1.0.0" }
fepdf-font = { path = "crates/fepdf-font", version = "1.0.0" }
fepdf-content = { path = "crates/fepdf-content", version = "1.0.0" }
fepdf-render = { path = "crates/fepdf-render", version = "1.0.0" }
fepdf-sdk = { path = "crates/fepdf-sdk", version = "1.0.0" }
fepdf-mcp = { path = "crates/fepdf-mcp", version = "1.0.0" }
fepdf-wasm = { path = "crates/fepdf-wasm", version = "1.0.0" }
fepdf-macros = { path = "crates/fepdf-macros", version = "1.0.0" }

# GUI, Web & CLI Ecosystem
eframe = { version = "0.34", features = ["wgpu"] }
egui = "0.34"
egui-wgpu = "0.34"
wgpu = "29"
rfd = "0.15"
pollster = "0.4"
regex = "1.10"
peniko = "0.6"
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
env_logger = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "ImageData", "Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

[workspace.package]
version = "1.0.0"
authors = ["fepdf Developers"]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/akahmys/fepdf"

[workspace.metadata.hirt]
integrity_level = "high"
compliance_standard = "ISO 32000-2:2020"
safety_protocol = "HDD-SR-01"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
too_many_lines = "allow"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
if_not_else = "allow"
redundant_else = "allow"
items_after_statements = "allow"
option_if_let_else = "allow"
collapsible_if = "warn"
collapsible_else_if = "warn"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
match_same_arms = "allow"
single_match_else = "allow"
manual_let_else = "allow"
redundant_closure_for_method_calls = "allow"
or_fun_call = "allow"
used_underscore_binding = "allow"
unused_self = "allow"
type_complexity = "allow"
unreadable_literal = "allow"
use_self = "allow"
redundant_closure = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
