[package]
name = "fepdf-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal CLI tool for PDF 2.0 auditing, rendering, and manipulation"

[[bin]]
name = "fepdf"
path = "src/main.rs"

[dependencies]
# Rasterises pages (debug render subcommand), so the SDK's optional GPU path is required.
fepdf-sdk = { workspace = true, features = ["render"] }
clap.workspace = true
anyhow.workspace = true
lopdf.workspace = true
inquire.workspace = true
bytes.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger.workspace = true
image.workspace = true

[features]
debug-tools = ["fepdf-sdk/debug-tools"]

[lints]
workspace = true
