[package]
name = "fepdf-doc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ARCHITECTURE.md 5.1: owns the Operation vocabulary and document mutations.
# Operates on the document model without depending on any frontend or GPU rendering.
[dependencies]
fepdf-model.workspace = true
fepdf-content.workspace = true
fepdf-font.workspace = true
kurbo.workspace = true
serde.workspace = true
bytes.workspace = true
# XFDF (ISO 19444-1) is XML; the model already reads XMP with this one, which compiles no C.
roxmltree.workspace = true
# Pages made from pictures: a PNG's resolution and profile, and a TIFF's every page.
png.workspace = true
tiff.workspace = true
# Pages made from plain text: where a line may break (UAX #14).
unicode-linebreak.workspace = true

[lints]
workspace = true

[dev-dependencies]
fepdf-fixtures.workspace = true
# Only the tests need this: `Operation`'s JSON is a public interface — `fepdf-mcp`
# deserialises a caller's string into one — and nothing exercised it until Rule D moved
# six operations here.
serde_json.workspace = true
