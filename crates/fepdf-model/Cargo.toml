[package]
name = "fepdf-model"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fepdf-macros.workspace = true
fepdf-font.workspace = true
fepdf-syntax.workspace = true
unicode-normalization.workspace = true
log.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
kurbo.workspace = true
flate2.workspace = true
image.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
hayro-ccitt.workspace = true
roxmltree.workspace = true
moxcms.workspace = true
xmp-writer.workspace = true
rayon.workspace = true
ttf-parser.workspace = true
parking_lot.workspace = true
# `sha2` and `rand` were here as well as in `[dev-dependencies]` below, where the
# signing fixture uses them. Nothing in `src/` referenced either, so the runtime pair
# were duplicates that every consumer of this crate linked.
md5.workspace = true
hex.workspace = true
nom.workspace = true
hayro-jbig2.workspace = true
hayro-jpeg2000.workspace = true

# Making a throwaway certificate to sign with. Test-only on purpose: a checked-in
# private key would be a checked-in private key, and `betterleaks` scans for them.
[dev-dependencies]
fax.workspace = true
rsa = { workspace = true, features = ["sha2"] }
sha2.workspace = true
rand.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["builder"] }
der = { version = "0.7", features = ["derive"] }

[features]
debug-tools = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
