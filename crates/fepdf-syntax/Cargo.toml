[package]
name = "fepdf-syntax"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ARCHITECTURE.md: this is the byte layer. It must not depend on the object model
# -- that is the property which lets the cryptography be reasoned about on its own.
[dependencies]
bytes.workspace = true
thiserror.workspace = true
aes.workspace = true
md5.workspace = true
sha2.workspace = true
der.workspace = true
spki.workspace = true
rsa.workspace = true
signature.workspace = true
sha1.workspace = true
rand.workspace = true
cms = { version = "0.2.3", default-features = false, features = ["builder", "std"] }
const-oid = { version = "0.9", features = ["db"] }
x509-cert = { version = "0.2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
rand = "0.8"
