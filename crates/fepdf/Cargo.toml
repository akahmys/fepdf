[package]
name = "fepdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fepdf-model.workspace = true
fepdf-content.workspace = true
fepdf-doc.workspace = true
# Rasterisation is opt-in: only `render_page_to_file` needs it, and pulling
# vello + wgpu into every SDK consumer is not free. See ARCHITECTURE.md Rule B.
fepdf-render = { workspace = true, optional = true }
kurbo.workspace = true
serde.workspace = true
bytes.workspace = true
image = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
chrono.workspace = true
log.workspace = true

[dev-dependencies]
# The three examples whose `main` is async: `page_quadrants`, `render_all_samples` and
# `render_japanese_samples`. **Dev, and not runtime.**
#
# It sat in `[dependencies]` under a note saying that nothing in `src/` touches it and
# that the audit kept it because `--all-targets` failed without it. The first half was
# right and the second was not: an example's dependency is a dev-dependency, and
# `cargo check --workspace --all-targets` passes with it declared here.
#
# What the misplacement cost: every consumer of this facade linked tokio with
# `features = ["full"]`, and `mio` came with it. That is how `fepdf-wasm` came to hold a
# crate that does not compile for `wasm32-unknown-unknown` while nothing in the workspace
# referenced it.
tokio.workspace = true
# `inspect_decoded_page2`, the one example that turns logging on. It was in
# `[dependencies]`, where nothing in `src/` referenced it: the facade emits through `log`
# and leaves the choice of backend to whoever links it, which is the whole point of the
# `log` facade and the opposite of shipping one.
env_logger.workspace = true

[features]
default = []
## Enables `PdfDocument::render_page_to_file`, backed by Vello + wgpu.
render = ["dep:fepdf-render", "dep:pollster", "dep:image"]
## Forwards fepdf-model's glyph tracing, used by `fepdf debug trace-font`.
debug-tools = ["fepdf-model/debug-tools"]

[lints]
workspace = true

# Rasterises, so it needs `render`. Under `cargo test --workspace` feature unification
# turns that on — `fepdf-cli` asks for it — so this runs there and is skipped by a bare
# `cargo test -p fepdf`, which is the right way round: a package-only run may have no
# device to rasterise with.
[[test]]
name = "rasteriser_determinism_test"
required-features = ["render"]

# `page_quadrants` uses `fepdf_render` like the two below and did not say so, so
# `cargo clippy -p fepdf --all-targets` failed on it while
# `cargo clippy --workspace --all-targets` passed: feature unification turns `render` on
# when another member asks for it, and the audit only ever runs the workspace form.
[[example]]
name = "page_quadrants"
required-features = ["render"]

[[example]]
name = "render_all_samples"
required-features = ["render"]

[[example]]
name = "render_japanese_samples"
required-features = ["render"]

